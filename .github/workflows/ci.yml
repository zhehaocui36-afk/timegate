name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build · Lint · Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, lint and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon

      # 零联网承诺（R-02 / R-110）：合并后的 Manifest 不得出现 INTERNET。
      # 用 SDK 自带的 aapt2 dump permissions 检查最终 APK 的真实权限。
      - name: Verify merged manifest has no INTERNET permission
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n1)
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found under $SDK_ROOT/build-tools"
            exit 1
          fi
          echo "Using aapt2: $AAPT2"
          PERMS=$("$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk)
          echo "--- declared permissions ---"
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "::error::Merged manifest declares android.permission.INTERNET — forbidden (zero-network promise)."
            exit 1
          fi
          echo "OK: no INTERNET permission."

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
